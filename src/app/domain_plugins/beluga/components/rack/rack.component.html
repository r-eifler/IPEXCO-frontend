<div class="container">
    <div class="info-container">
        <span style="font-weight: 500;">{{ name() }}</span>
        <span>{{ occupied() }}/{{ rack()?.size }}</span>
    </div>
    <div 
        class="rack" 
        [style.width]="(rack()?.size * 15) + 'px'"
        [matTooltip]="tooltip()"
    >
        @for(jig of rack()?.jigs; track jig){
            <app-jig [jig]="jig" [jigType]="jigTypes()?.[jig?.type]"></app-jig>
        }
    </div>
</div>
