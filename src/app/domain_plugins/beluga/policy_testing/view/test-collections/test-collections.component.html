<app-page>
    <app-page-title>
        Tests Suites
    </app-page-title>
    <app-page-content>
         <div class="page-grid">
            @for(testCollection of testCollections(); track testCollection._id){
                <app-test-collection-card [testCollection]="testCollection"></app-test-collection-card>
            }
            
            <button app-action-card (click)="open_test_collection_dialog()">
                <span>Create a new test collection</span>
                <mat-icon>add</mat-icon>
            </button>
         </div>
    </app-page-content>
</app-page>
