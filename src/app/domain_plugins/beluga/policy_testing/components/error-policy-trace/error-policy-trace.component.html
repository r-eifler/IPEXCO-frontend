<div class="trace-actions">
    <div class="actions-prefix">
        @for(action of prefixAndLoop()?.[0]; track action;){
        <app-action-card
            [action]="action"
            [highlight]="false"
            [select]="false"
        ></app-action-card> 
        }
    </div>
    <mat-icon>cycle</mat-icon>
    <div class="actions-loop">
        @for(action of prefixAndLoop()?.[1]; track action;){
        <app-action-card
            [action]="action"
            [highlight]="false"
            [select]="false"
        ></app-action-card> 
        }
    </div>
</div>
