<mat-expansion-panel>
    <mat-expansion-panel-header>
    <mat-panel-title> Test State {{testCase().testID}} </mat-panel-title>
    <mat-panel-description>
        {{method()}}
        <mat-icon>{{icon()}}</mat-icon>
    </mat-panel-description>
    </mat-expansion-panel-header>
    <div class="actions">
        @for(action of actions(); track action;){
           <app-action-card
            [action]="action"
            [highlight]="false"
            [select]="false"
           ></app-action-card> 
        }
    </div>
</mat-expansion-panel>
