<app-page *transloco="let t">
    <app-page-title>{{t('h.project')}} {{(project$ | async)?.name}}
      <app-page-title-action>
        <button  mat-icon-button (click)="deleteProject()">
          <mat-icon>delete</mat-icon>
        </button>
      </app-page-title-action>
    </app-page-title>
  
    <app-page-content>
      <div class="page-grid">
  
        <app-project-action-card>
          <span action-title>{{t('h.manual_planning')}}</span>
          <span action-description>
            {{t('h.manual_planning_description')}}
          </span>
          <a mat-flat-button [routerLink]="['/beluga/manual-planning', (project$ | async)?._id]" action-button>
            Start
          </a>
        </app-project-action-card>

          </a>
