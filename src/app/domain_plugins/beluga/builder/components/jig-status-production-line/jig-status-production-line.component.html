<div
    class="container"
    [class.next]="status().next"
>
    <app-jig
        [class.skipped]="status()?.skip"
        [jig]="jig()"
        [jigType]="jigType()"
        [isGhost]="!status()?.delivered"
        [animate]="true"
        [incomingFlight]="incomingFlightJigMap()?.[jig().name] ?? null"
        [unitSize]="true"
        [draggable]="true"
        [showOnlyPart]="true"
    >
    </app-jig>

    <div>
    @if (!status()?.onSite) {
        <mat-icon class="error">wrong_location</mat-icon>
    }
    </div>
</div>
