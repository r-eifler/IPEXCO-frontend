<div class="main">
    @for(trailer of (trailerStates$ | async); track trailer.name){
        <app-trailer
            [trailer]="trailer"
            [side]="side()"
            [jig]="trailer.jig"
            [jigType]="(jigTypes$ | async)?.[trailer.jig?.type]">
        </app-trailer>
    }
</div>
