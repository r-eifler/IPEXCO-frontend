<mat-card appearance="outlined" *transloco="let t">
    <mat-card-header>
        <mat-icon mat-card-avatar>flight_land</mat-icon>
        <mat-card-title>{{t('b.incoming_flight')}}</mat-card-title>
    </mat-card-header>
    <mat-card-content
        class="content"
        cdkDropList
        id="incoming"
        [cdkDropListData]="incomingJigsStatusSchedule()"
        [cdkDropListEnterPredicate]="noDrop"
        [class.noDragTarget]="(dragInProgress$ | async)"
        (cdkDropListDropped)="drop($event)"
    >
        @if(!flightIsEmpty()){
            @for(e of incomingJigsStatusSchedule(); track e.jig?.name; let idx = $index){
                <app-jig-status-incoming
                    [index]="idx"
                    [jig]="e.jig"
                    [jigType]="jigTypes()?.[e.jig?.type]"
                    [status]="e.status"
                    [flight]="currentFlight()"
                    [isSkipPossible]="skipPossible()"
                    [isUnloadPossible]="unloadAvailable()"
                    (skip)="onSkip()"
                    (unload)="onUnload()"
                ></app-jig-status-incoming>
            }
        }
        @else{
            <app-info>
                <mat-icon>info</mat-icon>
                {{t('b.empty_flight')}}
            </app-info>
        }
    </mat-card-content>
</mat-card>
