<div
    class="container"
    [class.next]="status().next"
    [class.skipped]="status()?.skip"
>
    <app-jig
        [jig]="jig()"
        [jigType]="jigType()"
        [unitSize]="true"
        [draggable]="status().next"
        [isGhost]="status()?.unloaded"
        [animate]="true"
        cdkDrag
        [cdkDragData]="jig()"
        (cdkDragStarted)="onStartDrag()"
        (cdkDragDropped)="onCancelDrag($event)"
        cdkDragBoundary=".beluga-boundary"
    >
    </app-jig>

    <div class="button-container">
      @if (status()?.next) {
        <button mat-icon-button (click)="onSkip()" [disabled]="!isSkipPossible()"><mat-icon>step_over</mat-icon></button>
        <button mat-flat-button class="primary" (click)="onUnload()" [disabled]="!isUnloadPossible()"><mat-icon>arrow_forward</mat-icon></button>
      }
    </div>
</div>
