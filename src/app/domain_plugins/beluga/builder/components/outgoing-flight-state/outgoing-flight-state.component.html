<div class="main" *transloco="let t">
    <div>
        <span class="header">{{t('b.outgoing_flight')}}</span>
    </div>
    <div>
        @if(jigTypesScheduled()?.length > 0){
            @for(jigType of jigTypesScheduled(); track jigType){
                <p>{{jigType}}: {{remaining()}}</p>
            }
        }
        @else{
            <p>{{t('b.no_jigs_scheduled')}}</p>
        }
        <div class="jigsCon">
        @for(jig of jigsLoaded(); track jig.name){
            <app-jig
                [jig]="jig"
                [jigType]="jigTypes()?.[jig.type]"
                [unitSize]="true"
            ></app-jig>
        }
        </div>
</div>
