@let jigTypes = jigTypes$ | async;

<div>
    @for(hangar of (hangars$ | async); track hangar){
        <app-hangar>
            @if(hangar.jig !== null){
                <app-jig
                    [jig]="hangar.jig"
                    [jigType]="jigTypes?.[hangar.jig?.type]"
                ></app-jig>
            }
        </app-hangar>
    }
</div>
