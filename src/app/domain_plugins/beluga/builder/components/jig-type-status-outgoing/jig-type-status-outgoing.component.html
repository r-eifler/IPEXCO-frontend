<div 
    class="container" 
    [class.next]="status().next"
    [class.skipped]="status()?.skip"
>
    @if(index() !== null){
        <span class="index">{{ (index() ?? 0) + 1}}</span>
    }
    <app-jig
        [jig]="jig()"
        [jigType]="jigType()"
        [unitSize]="true"
        [draggable]="false"
    >
    </app-jig>
    @if (status()?.loaded) {
        <mat-icon>check</mat-icon>
    }
    @else{
        <mat-icon>close</mat-icon>
    }
</div>
