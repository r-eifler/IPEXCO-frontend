<div class="container">
    <div class="info-container">
        <span style="font-weight: 500;">{{ name() }}</span>
        <span>{{ occupied() }}/{{ rack()?.size }}</span>
    </div>
    <div>
        <div 
            cdkDropList
            [id]="rack()?.name"
            [cdkDropListData]="rack()?.jigs"
            (cdkDropListDropped)="drop($event)"
            [cdkDropListEnterPredicate]="fits"
            class="rack" 
            [style.width]="((rack()?.size * 15) + 2) + 'px'"
            [class.dragTarget]="(isDragTarget$ | async) && (dragInProgress$ | async)"
            [class.noDragTarget]="!(isDragTarget$ | async) && (dragInProgress$ | async)"
        >
            @for(jig of rack()?.jigs; track jig; let idx = $index){
                @if(idx === 0 || idx === rack()?.jigs.length - 1){
                    <app-jig 
                        [jig]="jig" 
                        [jigType]="jigTypes()?.[jig?.type]"
                        [cdkDragData]="jig"
                        [draggable]="true"
                        cdkDrag
                        (cdkDragStarted)="onStartDrag(jig, getSides(idx))"
                        (cdkDragDropped)="onCancelDrag($event)"    
                    >
                    </app-jig>
                }
                @else{
                    <app-jig 
                        [jig]="jig" 
                        [jigType]="jigTypes()?.[jig?.type]"
                    >
                    </app-jig>
                }
            }   
        </div>
    </div>
</div>
