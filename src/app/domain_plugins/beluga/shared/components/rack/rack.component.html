<div
  class="container"
  [class.dragScale]="dragTarget()"
  [class.noDragTarget]="noDragTarget()"
  [class.maintenance]="maintenance()"
  [style.width]="((size() * 15) + 2) + 'px'"
>
  <div class="header">
    <div class="info-container">
        <mat-icon>shelves</mat-icon>
        <span>{{ name() }}</span>
    </div>

    <div class="header-end">
      <div class="status-container">
          @if(maintenance()){
              <div class="status error">
                <mat-icon [inline]="true">construction</mat-icon>
              </div>
          }
          @if(inConflict()){
              <div class="status error">
                <mat-icon [inline]="true">error</mat-icon>
              </div>
          }
      </div>
      <div class="capacity-container">
        <mat-icon>fit_screen</mat-icon>
        <span>
          <span class="occupied">{{ occupied() }}</span>
          <span>/{{ size() }}</span>
        </span>
      </div>
    </div>
  </div>

  <div>
      <div
          class="rack"
          [class.dragTarget]="dragTarget()"
      >
        <ng-content select="app-jig,app-drop-target"></ng-content>

        @if(dragTarget()) {
          <mat-icon class="dragIcon">place_item</mat-icon>
        }
      </div>
  </div>
</div>
