<div class="container" [ngClass]="{'hover': isHovering  && draggable()}" (mouseover)="onHover()" (mouseout)="onMouseOut()">
    <div 
        class="jig" 
        [matTooltip]="tooltip()"
        [style.width]="jigDisplaySize() + 'px'  "
        [ngClass]="{'hover': isHovering && draggable()}"
    >
    @if(!loaded()) {
        <span class="name">{{ jigType()?.name }}</span>
    }
    </div>
    @if(loaded()){
        <div
            class="part" 
            [matTooltip]="tooltip()"
            [style.width]="partDisplaySize() + 'px'  "
            [ngClass]="{'hover': isHovering && draggable()}"
        >
            @if(!unitSize()){
                <span class="name"><span class="bold">{{ name() }}</span> ({{ jigType()?.name }})</span>
            }
            @else{
                <span class="name"><span class="bold">{{ name() }}</span></span>
            }
           
        </div>
    }
</div>
