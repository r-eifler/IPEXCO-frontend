<div 
    class="container" 
    [ngClass]="{'hover': isHovering  && draggable()}" 
    (mouseover)="onHover()" (mouseout)="onMouseOut()"
    cdkOverlayOrigin #trigger="cdkOverlayOrigin"
>
    <div 
        class="jig" 
        [style.width]="jigDisplaySize() + 'px'  "
        [ngClass]="{'hover': isHovering && draggable()}"
    >
    @if(!loaded()) {
        <span class="name">{{ jigType()?.name }}</span>
    }
    </div>
    @if(loaded()){
        <div
            class="part" 
            [style.width]="partDisplaySize() + 'px'  "
            [ngClass]="{'hover': isHovering && draggable()}"
        >
            @if(!unitSize()){
                <span class="name"><span class="bold">{{ name() }}</span> ({{ jigType()?.name }})</span>
            }
            @else{
                <span class="name"><span class="bold">{{ name() }}</span></span>
            }
           
        </div>
    }
    <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        [cdkConnectedOverlayOpen]="isHovering && showTooltip()"
    >
        <div class="info">
            <mat-list>
                <mat-list-item>
                    <mat-icon matListItemIcon>crop_16_9</mat-icon>
                    <div matListItemTitle>{{status()}}</div>
                </mat-list-item>
                <mat-list-item>
                    <mat-icon matListItemIcon>fit_screen</mat-icon>
                    <div matListItemTitle>{{sizeEmpty()}}/{{sizeLoaded()}}</div>
                </mat-list-item>
                <mat-list-item>
                    <mat-icon matListItemIcon>category</mat-icon>
                    <div matListItemTitle>{{type()}}</div>
                </mat-list-item>
            </mat-list>
        </div>
    </ng-template>
    @if(!draggable() && !unitSize()){
        <mat-icon class="icon">lock</mat-icon>
    }
</div>
