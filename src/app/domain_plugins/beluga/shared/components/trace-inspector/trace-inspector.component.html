<div class="main">
    <app-multi-flight-card
              [jigs]="jigs()"
              [jigTypes]="jigTypes()"
              [flights]="flightSchedule()"
              [highlighted]="currentRelativeFlightIndex()"
    ></app-multi-flight-card>
    <div class="controls">
        <app-step-control
            (back)="onBack()"
            (forward)="onForward()"
        ></app-step-control>
        <a mat-button 
            (click)="onCancel()"
            [routerLink]="['../../flight-sections']">
            <mat-icon>chevron_left</mat-icon>
            Back
        </a>
    </div>
    <app-plan-action-list
        [actions]="actions()"
        [selectedAction] = "selectedActionIndex()"
        (actionSelected)="onActionSelected($event)"
    ></app-plan-action-list>
    <div class="state">
        <app-state-card
            [state]="selectedState()"
            [siteSetUp]="siteSetUp()"
            [targetFlightSchedule]="currentFlight()"
            [targetProductionSchedule]="productionSchedule()"
        >
        </app-state-card>
    </div>
</div>
