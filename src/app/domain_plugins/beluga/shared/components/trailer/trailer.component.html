<div class="container">
    <div>
        <mat-icon>local_shipping</mat-icon>
    </div>
    <div class="trailer" 
        cdkDropList [cdkDropListData]="[jig()]" 
        (cdkDropListDropped)="drop($event)"
        [id]="name()"
        [cdkDropListEnterPredicate]="empty">
        @if(jig() != null){
            <app-jig 
                [jig]="jig()" 
                [jigType]="jigType()"
                cdkDrag>
            </app-jig>
        }
    </div>
</div>
