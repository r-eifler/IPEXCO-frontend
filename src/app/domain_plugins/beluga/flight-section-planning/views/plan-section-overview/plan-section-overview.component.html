<app-page *transloco="let t">
    <app-breadcrumb>
        <a app-breadcrumb-item [routerLink]="['/beluga/projects/' + project()?._id]"><mat-icon>home</mat-icon></a>
        <app-breadcrumb-item><mat-icon>connecting_airports</mat-icon></app-breadcrumb-item>
    </app-breadcrumb>
    <app-page-title>
       {{t('f.flight_section_plans')}}
    </app-page-title>
    <app-page-hero>
        <app-section-tree-hero></app-section-tree-hero>
    </app-page-hero>    
    <app-page-content>
        <app-page-section-list>
            <app-page-section>
                <app-page-section-content>
                    <app-controls
                        [disabled]="! hasTree()"
                    ></app-controls>
                </app-page-section-content>
            </app-page-section>               
            <app-page-section>
                <app-page-section-content>
                    @if(hasTree()){
                        <app-section-tree></app-section-tree>
                    }
                    @else{
                        <div class="new-forest">
                            <button mat-flat-button (click)="newTree()">
                                <mat-icon>play_arrow</mat-icon>
                                Start Planning
                            </button>
                        </div>
                    }
                </app-page-section-content>
            </app-page-section>
        </app-page-section-list>
    </app-page-content>
</app-page>
