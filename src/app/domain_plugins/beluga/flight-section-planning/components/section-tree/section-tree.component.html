<div class="list" *transloco="let t">
    @for(section of sections(); track section._id; let last = $last; let idx = $index){
        <app-section-card
            [section]="section"
            [sectionIndex]="idx"
        >
        </app-section-card>
    }
    @if(hasNextFlight()){
        <button mat-flat-button 
        (click)="onNextFlightPlan()"
        [disabled]="!lastSectionFinished()"
        >
            Configure Next Flights
        </button>
    }
</div>
