<div class="container">
    <div class="buttons">
        <app-swap-configurator 
        [value]="maxSwaps()" 
        (valueChange)="onSwapChange($event)"
        [disabled]="!allowModifications()"
        ></app-swap-configurator>
        <mat-slide-toggle 
            [checked]="keepRackEmpty()" 
            (change)="onToggleRack()"
            [disabled]="numEmptyRacks() == 0 || !allowModifications()">
                Keep at lest one rack empty
        </mat-slide-toggle>
    </div>
    <div class="buttons">
        <a mat-button [routerLink]="['../../flight-sections']">
            <mat-icon>cancel</mat-icon>
            Cancel
        </a>
        <a mat-flat-button 
            [routerLink]="['../../configuration-explanations/' + section()?._id + '/' +  (section()?.configurationIndex + 1)]"
            (click)="onSave()">
            <mat-icon>save</mat-icon>
            Save
        </a>
    </div>
</div>
