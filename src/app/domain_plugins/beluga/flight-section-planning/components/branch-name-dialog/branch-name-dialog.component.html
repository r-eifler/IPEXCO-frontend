<app-dialog *transloco="let t">
    <app-dialog-header>
        <app-dialog-title>{{t('f.name_new_plan_version')}}</app-dialog-title>
    </app-dialog-header>
    <app-dialog-content>
        <div class="main">
            <mat-form-field class="full-width" appearance="outline">
                <mat-label>{{ t('f.name') }}</mat-label>
                <input matInput [(ngModel)]="name">
            </mat-form-field>
        </div>
    </app-dialog-content>
    <app-dialog-footer>
        <button mat-button (click)="onCancel()">{{t('f.cancel')}}</button>
        <button mat-flat-button (click)="onStart()" [disabled]="!nameSet()">{{t('f.new')}}</button>
    </app-dialog-footer>
</app-dialog>
