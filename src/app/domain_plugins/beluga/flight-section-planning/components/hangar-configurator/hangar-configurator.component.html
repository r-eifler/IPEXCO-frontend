<div 
    class="container"
>
    @if(!isUsed()){
        <button mat-icon-button (click)="onUnlock()">
            <mat-icon>lock_open</mat-icon>
        </button>
    }
    @else{
        <button mat-icon-button (click)="onLock()" [disabled]="isLoaded()">
            <mat-icon>lock</mat-icon>
        </button>
    }
    <app-hangar
        [class.notUsed]="!isUsed()"
        [name]="hangar().name">
        @if(jig()){
            <app-jig
                [jig]="jig()"  
                [jigType]="jigTypes()?.[jig()?.type]"
                draggable="false"
            >
            </app-jig>
        }
    </app-hangar>
</div>
