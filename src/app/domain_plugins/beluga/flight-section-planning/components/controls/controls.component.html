<div class="main" *transloco="let t" >
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ t('f.plan_version') }}</mat-label>
        <mat-select [formControl]="form.controls.branch">
          @for (branch of branches(); track branch.name;  let idx = $index) {
            <mat-option [value]="idx">{{ branch.name }}</mat-option>
          }
        </mat-select>
    </mat-form-field>
    <div class="divider"></div>
    <a mat-icon-button tooltip="Compare metrics of different plan versions"
      [routerLink]="['../metrics']"
    >
      <mat-icon>analytics</mat-icon>
    </a>
</div>
