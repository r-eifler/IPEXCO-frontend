<div class="container">
    @for(plTS of displaySchedules(); track plTS.name; let idx = $index){
        <app-production-line-configurator
            [originalSchedule]="originalSchedules()?.[idx]"
            [productionLineTargetSchedule]="plTS"
            [jigsOnSite]="jigsOnSite()"
            [jigTypes]="jigTypes()"
            [jigs]="jigs()"
            (targetSchedule)="onChangeProductionTarget($event, idx)"
        >
        </app-production-line-configurator>
    }
</div>
