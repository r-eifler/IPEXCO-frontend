<div class="container">
    @for(schedule of productionLineTargetSchedules(); track schedule.name; let idx = $index){
        <app-production-line-configurator
            [productionLineTargetSchedule]="schedule"
            [jigsOnSite]="jigsOnSite()"
            [jigTypes]="jigTypes()"
            [jigs]="jigs()"
            (targetSchedule)="onChangeProductionTarget($event, idx)"
        >
        </app-production-line-configurator>
    }
</div>
