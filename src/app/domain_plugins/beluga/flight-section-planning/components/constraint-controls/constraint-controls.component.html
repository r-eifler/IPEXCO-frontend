<div class="container" >
    <div class="buttons">
        <app-swap-configurator 
            [value]="constraintMaxSwaps()" 
            (valueChange)="onSwapChange($event)"
            [disabled]="!allowModifications()"
        ></app-swap-configurator>
        <mat-slide-toggle 
            [checked]="keepOneRackEmpty()" 
            (change)="onToggleRack($event)"
            [disabled]="numEmptyRacks() == 0 || !allowModifications()">
                Keep One Rack Empty
        </mat-slide-toggle>
    </div>
</div>
