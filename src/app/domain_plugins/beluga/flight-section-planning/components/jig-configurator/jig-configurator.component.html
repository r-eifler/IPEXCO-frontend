<div  class="container"
    [class.hideIcons]="hideIcons()"
    [class.inConflict]="inConflict()"
>
    @if(index() !== null){
        <span class="index">{{ (index() ?? 0) + 1}}</span>
    }
    <app-jig
        [class.notUsed]="status()?.skip"
        [jig]="jig()"  
        [jigType]="jigType()"
        [incomingFlight]="incomingFlightJigMap()?.[jig()?.name] ?? null"
        [unitSize]="true"
        [draggable]="true"
        [showOnlyPart]="showOnlyPart()"
        [disabled]="status()?.skip"
    >
    </app-jig>
    @if(! hideIcons()){
        @if(!status()?.onSite){
            <mat-icon class="error">wrong_location</mat-icon>
        }
        @if(!status()?.skip){
            <button mat-icon-button (click)="onStatusChanged(true)" [disabled]="disabled()">
                <mat-icon>step_over</mat-icon>
            </button>
        }
        @else{
            <button mat-icon-button (click)="onStatusChanged(false)" [disabled]="mustBeSkipped() || disabled()">
                <mat-icon>check</mat-icon>
            </button>
        }
    }
</div>
