<div>
    <ngx-charts-line-chart
        [legend]="legend"
        [showXAxisLabel]="showXAxisLabel"
        [showYAxisLabel]="showYAxisLabel"
        [xAxis]="xAxis"
        [yAxis]="yAxis"
        [xAxisLabel]="'f.flight_sections' | transloco"
        [yAxisLabel]=" 'f.' + metric() | transloco"
        [results]="data()"
    >
    </ngx-charts-line-chart>
</div>
