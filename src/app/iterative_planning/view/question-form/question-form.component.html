<h2>Questions</h2>
<h3>US-WHY</h3>
<mat-selection-list #quests (selectionChange)="onSelectionChanged($event, quests.selectedOptions.selected)">
  @for (question of avaQuestions; track question) {
    <mat-list-option [value]="question" [selected]="question === selectedItem">
      <div>{{question.message.mainText}}</div>
      @if(property() != null){
        <div style="color: gray">{{property().name}}</div>
      }
    </mat-list-option>
  }
</mat-selection-list>
