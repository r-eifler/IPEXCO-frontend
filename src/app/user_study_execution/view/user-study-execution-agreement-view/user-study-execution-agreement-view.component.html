@let userStudy = userStudy$ | async;
@let prolificId = prolificId$ | async;

<app-page *transloco="let t">
  <app-page-title>
    {{t('use.informed_consent')}}
  </app-page-title>
  <app-page-content>
    <app-page-section-list>
        <app-page-section>
          <app-page-section-title>
            {{t('use.related_project')}}
          </app-page-section-title>
          <app-page-section-content>
            <div [innerHTML]="userStudy?.relatedProject | marked"></div>
          </app-page-section-content>
        </app-page-section>
        <app-page-section>
          <app-page-section-title>
            {{t('use.expectations')}}
          </app-page-section-title>
          <app-page-section-content>
            <div [innerHTML]="userStudy?.expectation | marked"></div>
          </app-page-section-content>
        </app-page-section>
        <app-page-section>
          <app-page-section-title>
            {{t('use.withdraw')}}
          </app-page-section-title>
          <app-page-section-content>
            <div [innerHTML]="userStudy?.confidentiality | marked"></div>
          </app-page-section-content>
        </app-page-section>
        <app-page-section>
          <app-page-section-title>
            {{t('use.consent')}}
          </app-page-section-title>
          <app-page-section-content>
            <div class="consent-box">
              
              <app-info>
                <mat-icon>handshake</mat-icon>
                <span class="highlight">{{t('use.consent_info')}}</span>
              </app-info>
              <div>
                <button mat-flat-button (click)="onAccept(userStudy?._id, prolificId)">{{t('use.accept')}}</button>
              </div>
            </div>
          </app-page-section-content>
        </app-page-section>
    </app-page-section-list>
  </app-page-content>
</app-page>
