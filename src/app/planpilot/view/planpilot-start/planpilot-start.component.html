@let project = project$ | async;

<app-page>

    <a app-breadcrumb-item [routerLink]="['/project', project?._id]"><mat-icon>home</mat-icon></a>
    <app-breadcrumb-item>PlanPilot</app-breadcrumb-item>
  </app-breadcrumb>

  <app-page-title>PlanPilot</app-page-title>

  <app-page-content>

    <a mat-flat-button routerLink="navigation">Open navigation</a>
  </app-page-content>
</app-page>
