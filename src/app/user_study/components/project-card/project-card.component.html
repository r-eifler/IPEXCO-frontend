<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      Project
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="content">
    <form [formGroup]="form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Projects</mat-label>
        <mat-select [formControl]="form.controls.project" required>
          @for (project of projects(); track project._id) {
            <mat-option [value]="project._id">{{project.name}}</mat-option>
          }
        </mat-select>
        @if (form.controls.project.hasError('required')) {
          <mat-error>Please choose a project</mat-error>
        }
      </mat-form-field>
      <mat-label>Maximal time to work on the project:</mat-label>
      <mat-slider min="1" max="1800" step="1"  discrete [displayWith]="formatLabel" class="full-width">
        <input matSliderThumb [formControl]="form.controls.time">
      </mat-slider>
    </form>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-icon-button (click)="deletePart()">
      <mat-icon>delete</mat-icon>
    </button>
    <button mat-icon-button (click)="moveUp()" [disabled]="first()">
      <mat-icon>keyboard_arrow_up</mat-icon>
    </button>
    <button mat-icon-button (click)="moveDown()" [disabled]="last()">
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
