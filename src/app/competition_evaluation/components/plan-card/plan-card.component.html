<mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ instance()?.name }}</mat-card-title>
      <mat-card-subtitle></mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <div class="content">
        <div class="stats">  
          <mat-icon>attach_money</mat-icon>
          <span class="property-label">Plan Length:</span>
          <span class="property-value">{{ instance()?.actions?.length ?? '?'}}</span>
        </div>
  
        <div class="utility">
          <mat-icon>flight</mat-icon>
        </div>
      </div>
    </mat-card-content>
  
    <mat-card-actions>
      <div class="action-container">
        <a mat-stroked-button [routerLink]="[instance()?._id ]">Details</a>
      </div>
    </mat-card-actions>
  </mat-card>
