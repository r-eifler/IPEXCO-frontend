@let instance = instance$ | async;

<app-page>
  <app-breadcrumb>
    <a app-breadcrumb-item [routerLink]="['/competition-evaluation/collection/']"><mat-icon>home</mat-icon></a>
    <app-breadcrumb-item>{{ (instance$ | async)?.name }}</app-breadcrumb-item>
  </app-breadcrumb>
  <app-page-title>
    {{ instance?.name }}
    <app-page-title-action>
    </app-page-title-action>
  </app-page-title>

  <app-page-content>
    <app-page-section-list>
      <app-page-section>
        <app-page-section-title>
          Explanation
        </app-page-section-title>
        <app-page-section-content>
          <p>Question</p>
          <div class="text-container">
            <p>{{ instance?.question }}</p>
          </div>
          <p>Answer</p>
          <div class="text-container">
            <div [innerHTML]="instance?.explanation | marked">

            </div>
          </div>

        </app-page-section-content>
      </app-page-section>

      <app-page-section>
        <app-page-section-title>
          Plan
        </app-page-section-title>
        <app-page-section-content class="plan-container">
          <app-step-control
              (back)="onBack()"
              (forward)="onForward()"
              [disabled]="false"
            ></app-step-control>
          <div class="plans-container">
            <app-plan-inspection
              [actions]="actions$ | async"
              [model]="model$ | async"
              [selectedJigs] = "null"
              [selectedFlight] = "null"
              [selectedAction] = "this.selectedActionIndex$ | async"
              [hiddenPrefix]="[]"
              (actionSelected)="onActionSelected($event)"
            ></app-plan-inspection>
          </div>
          <app-state-card
            [state]="selectedState$ | async"
            [model]="model$ | async"
          >
          </app-state-card>
        </app-page-section-content>
      </app-page-section>
    </app-page-section-list>
  </app-page-content>
</app-page>
