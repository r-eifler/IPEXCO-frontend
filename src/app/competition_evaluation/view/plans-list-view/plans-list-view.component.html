
<app-page>
  <app-breadcrumb>
    <app-breadcrumb-item>Evaluation Instances</app-breadcrumb-item>
  </app-breadcrumb>
  <app-page-title>
    
    Evaluation Instances

  </app-page-title>

  <app-page-content>
    <app-page-section-list>
      
      <app-page-section>
        <app-page-section-content>
          <div class="page-grid">
            @for(instance of  evaluationInstances$ | async; track instance) {
              <app-plan-card
                [instance]="instance"
              >
              </app-plan-card>
            }

            <button app-action-card (click)="onUpload()" *userRole="['admin','creator']">
              <div class="instructions">
                <span>Upload new instance.</span>
              </div>
              <mat-icon>cloud_upload</mat-icon>
            </button>

          </div>
        </app-page-section-content>
      </app-page-section> 

    </app-page-section-list>
  </app-page-content>
</app-page>
